services:
  # The Node.js Backend API
  - type: web
    name: task-management-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # The PostgreSQL Database
  - type: psql
    name: task-management-db
    plan: free # Note: Render free databases expire in 90 days.
